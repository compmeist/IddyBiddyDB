<!doctype html>
<meta charset="utf-8">
<title>IddyBiddyDB browser integration test</title>
<body>RUNNING</body>
<script type="module">
// Real-IndexedDB integration test (needs a browser; Node tests cover logic).
// Serve the IddyBiddyDB folder over http, open this page, read document.title.
import { ibOpenDatabase, ibDeleteDatabase, ibCreateSyncEngine, ibQueryStore, ibWorkOrderStores, ibSeedWorkOrder } from '../IB_index.js';

const results = [];
const check = (name, cond) => results.push(`${cond ? 'PASS' : 'FAIL'} ${name}`);
try {
  const name = `iddy-biddy-test-${Date.now()}`;
  const db = await ibOpenDatabase({ name, version: 1, stores: ibWorkOrderStores });
  const seed = ibSeedWorkOrder();
  for (const [store, rows] of Object.entries(seed)) await db.table(store).putAll(rows);

  check('seed count', (await db.table('workOrders').count()) === 1);
  check('get', (await db.table('people').get('P-1'))?.name === 'Ada');
  await db.table('workOrders').update('WO-1', { status: 'done' });
  check('single-record update', (await db.table('workOrders').get('WO-1'))?.status === 'done');
  await db.table('workOrders').update('WO-1', (o) => ({ ...o, title: `${o.title}!` }));
  check('function patch', (await db.table('workOrders').get('WO-1'))?.title === 'Fix pump!');

  const byId = await db.table('people').getAllAsMap();
  check('getAllAsMap', byId instanceof Map && byId.get('P-2')?.name === 'Bo');
  await db.table('people').putMap(new Map([['P-9', { id: 'P-9', name: 'Zed' }]]));
  check('putMap', (await db.table('people').get('P-9'))?.name === 'Zed');

  const planned = db.from('workOrders').where({ status: 'done' });
  check('index plan', planned.explain().source.strategy === 'index' && planned.explain().source.index === 'byStatus');
  check('indexed query result', (await planned.toArray()).length === 1);

  const nested = await db.from('workOrders')
    .nest({ via: 'link', links: 'assignments', targets: 'people', parentKey: 'id', linkParent: 'workOrderId', linkTarget: 'personId', targetKey: 'id', as: 'assignees' })
    .toArray();
  check('link nest x3', nested[0]?.assignees?.length === 3);

  let streamed = 0;
  for await (const _p of db.table('people').stream()) streamed++;
  check('stream', streamed === 4);

  await db.tx(['workOrders', 'assignments'], 'readwrite', async (tx) => {
    await tx.table('workOrders').put({ id: 'WO-2', title: 'Tx', status: 'open', createdAt: '2026-01-05' });
    await tx.table('assignments').add({ workOrderId: 'WO-2', personId: 'P-1' });
  });
  check('multi-store tx', (await db.table('workOrders').get('WO-2'))?.title === 'Tx');

  // Sync with hand-written (fake) backend functions: pull, mutate, syncOne.
  let pushed = null;
  const sync = ibCreateSyncEngine(db, {
    pull: async () => ({ changes: [{ store: 'people', record: { id: 'P-10', name: 'Remote' } }], seq: 5 }),
    push: async (batch) => { pushed = batch; },
  });
  await sync.pull();
  check('sync pull', (await db.table('people').get('P-10'))?.name === 'Remote');
  await sync.mutate('people', 'put', { id: 'P-11', name: 'Local' });
  check('mutate queued', (await (await import('../IB_sync.js')).ibPendingMutations(db)).length === 1);
  await sync.syncOne('people', 'P-11');
  check('syncOne pushed single', pushed?.length === 1 && pushed[0]?.record?.name === 'Local');

  const gridResult = await ibQueryStore(db, { baseStore: 'workOrders', searchFields: ['title'] },
    { sort: [{ id: 'id', desc: false }], filters: [], search: '', page: 0, pageSize: 1 });
  check('grid queryStore rows/total', gridResult.rows.length === 1 && gridResult.total === 2);

  let liveSeen = 0;
  const live = db.liveQuery(() => db.from('workOrders').toArray(), ['workOrders']);
  live.subscribe((rows) => { liveSeen = rows.length; });
  await db.table('workOrders').put({ id: 'WO-3', title: 'Live', status: 'open', createdAt: '2026-01-06' });
  await new Promise((r) => setTimeout(r, 50));
  check('liveQuery refresh', liveSeen === 3);
  live.dispose();

  // Transaction-bound writes were suppressed per-write; db.tx() must
  // publish them after commit or this live query never sees WO-4.
  let txLiveSeen = 0;
  const txLive = db.liveQuery(() => db.from('workOrders').toArray(), ['workOrders']);
  txLive.subscribe((rows) => { txLiveSeen = rows.length; });
  await db.tx(['workOrders', 'assignments'], 'readwrite', async (tx) => {
    await tx.table('workOrders').put({ id: 'WO-4', title: 'TxLive', status: 'open', createdAt: '2026-01-07' });
    await tx.table('assignments').add({ workOrderId: 'WO-4', personId: 'P-1' });
  });
  await new Promise((r) => setTimeout(r, 50));
  check('liveQuery refresh after tx commit', txLiveSeen === 4);
  txLive.dispose();

  // Cross-tab without any sync worker: a second ordinary connection to
  // the same database must hear the first one's writes as remote-change.
  let remoteHeard = 0;
  const db2 = await ibOpenDatabase({ name, version: 1, stores: ibWorkOrderStores });
  db2.on('remote-change', () => { remoteHeard++; });
  let crossSeen = 0;
  const crossLive = db2.liveQuery(() => db2.from('workOrders').toArray(), ['workOrders']);
  crossLive.subscribe((rows) => { crossSeen = rows.length; });
  await db.table('workOrders').put({ id: 'WO-5', title: 'CrossTab', status: 'open', createdAt: '2026-01-08' });
  await new Promise((r) => setTimeout(r, 50));
  check('cross-tab remote-change without worker', remoteHeard >= 1);
  check('cross-tab liveQuery refresh without worker', crossSeen === 5);
  crossLive.dispose();
  db2.close();

  db.close();
  await ibDeleteDatabase(name);
  check('cleanup', true);
} catch (err) {
  results.push(`FAIL exception: ${err?.message ?? err}`);
}
const failed = results.filter((r) => r.startsWith('FAIL')).length;
document.title = failed ? `IddyBiddyDB FAIL: ${results.find((r) => r.startsWith('FAIL'))}` : 'IddyBiddyDB PASS';
document.body.textContent = results.join('\n');
</script>
